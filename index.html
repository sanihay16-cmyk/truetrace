<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculator Web Application</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <main class="app-container">
    <div class="calculator-card" role="region" aria-label="Calculator">
      <!-- Calculator Header -->
      <header class="calculator-header">
        <div class="header-indicator">
          <span class="dot dot-red"></span>
          <span class="dot dot-yellow"></span>
          <span class="dot dot-green"></span>
        </div>
        <h1 class="calculator-title">Calculator</h1>
      </header>

      <!-- Calculator Screen / Display -->
      <div class="calculator-display" role="status" aria-live="polite">
        <div class="previous-operand" id="previous-operand" aria-label="Previous calculation"></div>
        <div class="current-operand" id="current-operand" aria-label="Current display">0</div>
      </div>

      <!-- Calculator Keypad -->
      <div class="calculator-keypad" role="group" aria-label="Calculator buttons">
        <!-- Row 1: Actions -->
        <button type="button" class="btn btn-action" id="btn-clear" data-action="clear" aria-label="Clear all">AC</button>
        <button type="button" class="btn btn-action" id="btn-delete" data-action="delete" aria-label="Delete last digit">⌫</button>
        <button type="button" class="btn btn-action" id="btn-negate" data-action="negate" aria-label="Toggle positive or negative">±</button>
        <button type="button" class="btn btn-operator" id="btn-divide" data-operator="÷" aria-label="Divide">÷</button>

        <!-- Row 2: 7, 8, 9, Multiply -->
        <button type="button" class="btn btn-number" data-number="7" aria-label="7">7</button>
        <button type="button" class="btn btn-number" data-number="8" aria-label="8">8</button>
        <button type="button" class="btn btn-number" data-number="9" aria-label="9">9</button>
        <button type="button" class="btn btn-operator" id="btn-multiply" data-operator="×" aria-label="Multiply">×</button>

        <!-- Row 3: 4, 5, 6, Subtract -->
        <button type="button" class="btn btn-number" data-number="4" aria-label="4">4</button>
        <button type="button" class="btn btn-number" data-number="5" aria-label="5">5</button>
        <button type="button" class="btn btn-number" data-number="6" aria-label="6">6</button>
        <button type="button" class="btn btn-operator" id="btn-subtract" data-operator="-" aria-label="Subtract">−</button>

        <!-- Row 4: 1, 2, 3, Add -->
        <button type="button" class="btn btn-number" data-number="1" aria-label="1">1</button>
        <button type="button" class="btn btn-number" data-number="2" aria-label="2">2</button>
        <button type="button" class="btn btn-number" data-number="3" aria-label="3">3</button>
        <button type="button" class="btn btn-operator" id="btn-add" data-operator="+" aria-label="Add">+</button>

        <!-- Row 5: 0, Decimal, Equals -->
        <button type="button" class="btn btn-number btn-zero" data-number="0" aria-label="0">0</button>
        <button type="button" class="btn btn-number" id="btn-decimal" data-action="decimal" aria-label="Decimal point">.</button>
        <button type="button" class="btn btn-equals" id="btn-equals" data-action="equals" aria-label="Equals">=</button>
      </div>

      <!-- Quick hint / footer -->
      <footer class="calculator-footer">
        <p class="hint-text">Supports keyboard input (0-9, +, -, *, /, Enter, Backspace, Esc)</p>
      </footer>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
